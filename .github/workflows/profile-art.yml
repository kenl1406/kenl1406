name: Profile art & stats

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # GitHub sometimes answers with an error page, so the snake gets a second try
      # and a failure never blocks the stats cards.
      - name: Contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2bbfa8&color_dots=#161b22,#0f3d39,#16695f,#22a594,#2bbfa8
            dist/snake-light.svg?palette=github-light&color_snake=#0f7f70&color_dots=#ebedf0,#b3efe4,#6ad8c5,#25b19c,#0f7f70

      - name: Contribution snake (retry)
        if: steps.snake.outcome == 'failure'
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2bbfa8&color_dots=#161b22,#0f3d39,#16695f,#22a594,#2bbfa8
            dist/snake-light.svg?palette=github-light&color_snake=#0f7f70&color_dots=#ebedf0,#b3efe4,#6ad8c5,#25b19c,#0f7f70

      - name: Stats card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&custom_title=Kendal%27s%20GitHub%20Stats&show_icons=true&hide_border=true&border_radius=16&bg_color=0c141b&title_color=2bbfa8&text_color=c4d2d8&icon_color=2bbfa8&ring_color=2bbfa8
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Top languages card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&border_radius=16&bg_color=0c141b&title_color=2bbfa8&text_color=c4d2d8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit the fresh art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Refresh profile art & stats" || exit 0
          git push
